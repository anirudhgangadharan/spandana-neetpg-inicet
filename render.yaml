services:
  - type: web
    name: spandana-neetpg-inicet
    runtime: docker
    dockerfilePath: ./Dockerfile.fetch
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Accounts plan — values are set in the Render dashboard, never here.
      # middleware.ts imports the Neon client on every request, so a missing
      # DATABASE_URL breaks the whole site, not just sign-in.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      # Stable Google provider subject for the one super-admin identity.
      - key: SUPER_ADMIN_GOOGLE_SUB
        sync: false
      # Long random bearer token for the scheduled expired-attempt endpoint.
      - key: ATTEMPT_SWEEP_SECRET
        sync: false
      # Public operator identity and privacy contact shown in the policy and required by readiness.
      - key: PRIVACY_OPERATOR_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Optional legacy verified-Google emails allowed to write editorial notes.
      # Prefer rows in editorial_note_grants for new installations.
      - key: ADMIN_EMAILS
        sync: false
